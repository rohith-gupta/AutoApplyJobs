spring.application.name=job-platform-service

# Connection is entirely environment-variable driven - no host, credentials,
# or database name are hard-coded. Defaults match docker-compose.yml's
# defaults (infrastructure/docker/), for a docker-compose-up-and-go local
# setup; override via env vars when the host port differs (see
# infrastructure/docker/.env.example) or for other environments.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:autoapplyjobs}
spring.datasource.username=${POSTGRES_USER:autoapplyjobs}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway is enabled (default, since flyway-core is on the classpath) but no
# migrations exist yet - that's the next milestone. With zero migration
# files present, Flyway just records an empty history; it does not fail.

# Hibernate must never generate or alter the schema. Flyway migrations are
# the only source of schema changes once they exist - this stays "none"
# permanently, not just until migrations are added.
spring.jpa.hibernate.ddl-auto=none
